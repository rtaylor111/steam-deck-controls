<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortcuts, Deck</title>
<style>
  :root {
    color-scheme: light;
    --page: #e6e6e6;
    --title: #f7f7f7;
    --title-line: #d6d6d6;
    --title-text: #1c1c1c;
    --body: #ffffff;
    --text: #1c1c1c;
    --muted: #5e5e5e;
    --line: #e2e2e2;
    --box: #d8d8d8;
    --field: #ffffff;
    --row: #ffffff;
    --pill: #efefef;
    --pill-text: #3a3a3a;
    --button: #f4f4f4;
    --button-text: #1c1c1c;
    --off: #f7f7f7;
    --off-text: #8d8d8d;
    --link: #1c1c1c;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --page: #121212;
    --title: #2a2a2a;
    --title-line: #3a3a3a;
    --title-text: #f3f3f3;
    --body: #1c1c1c;
    --text: #f3f3f3;
    --muted: #b5b5b5;
    --line: #2e2e2e;
    --box: #3a3a3a;
    --field: #262626;
    --row: #1c1c1c;
    --pill: #2e2e2e;
    --pill-text: #d7d7d7;
    --button: #2e2e2e;
    --button-text: #f3f3f3;
    --off: #242424;
    --off-text: #8d8d8d;
    --link: #f3f3f3;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #121212;
      --title: #2a2a2a;
      --title-line: #3a3a3a;
      --title-text: #f3f3f3;
      --body: #1c1c1c;
      --text: #f3f3f3;
      --muted: #b5b5b5;
      --line: #2e2e2e;
      --box: #3a3a3a;
      --field: #262626;
      --row: #1c1c1c;
      --pill: #2e2e2e;
      --pill-text: #d7d7d7;
      --button: #2e2e2e;
      --button-text: #f3f3f3;
      --off: #242424;
      --off-text: #8d8d8d;
      --link: #f3f3f3;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font: 18px/1.35 "Segoe UI", sans-serif;
  }
  .caption {
    margin: 0;
    padding: 16px 24px 8px;
    color: var(--muted);
    font-size: 14px;
  }
  .window {
    width: min(1280px, 100%);
    margin: 0 auto 28px;
    background: var(--body);
    border: 1px solid var(--box);
    border-radius: 10px;
    overflow: hidden;
  }
  @media (min-width: 800px) {
    .window { min-height: 800px; }
  }
  .titlebar {
    height: 56px;
    padding: 0 8px 0 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--title);
    color: var(--title-text);
    border-bottom: 1px solid var(--title-line);
    font-size: 20px;
    font-weight: 600;
  }
  .back {
    height: 44px;
    padding: 0 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--link);
    font: inherit;
    font-weight: 400;
    font-size: 18px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  .body { padding: 24px; }
  .lede { margin: 0 0 16px; }
  .folder {
    display: grid;
    grid-template-columns: 5.5rem minmax(0, 1fr) auto;
    column-gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }
  .folder label { margin: 0; }
  .path, .choose, .add, .write, .remove, input, select {
    height: 56px;
    border: 1px solid var(--box);
    border-radius: 8px;
    background: var(--field);
    color: var(--text);
    font: inherit;
    font-size: 18px;
  }
  .path {
    min-width: 0;
    padding: 0 14px;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .choose, .add, .write, .remove {
    padding: 0 16px;
    background: var(--button);
    color: var(--button-text);
  }
  .list {
    border: 1px solid var(--box);
    border-radius: 8px;
    overflow: hidden;
  }
  .row {
    min-height: 64px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--row);
    color: var(--link);
    text-decoration: none;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row-name { font-weight: 600; min-width: 0; }
  .kind {
    flex: 0 0 auto;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--pill);
    color: var(--pill-text);
    font-size: 14px;
    font-weight: 400;
    line-height: 20px;
  }
  .add, .remove { margin-top: 16px; }
  .write {
    display: block;
    width: 100%;
    margin-top: 12px;
    background: var(--off);
    color: var(--off-text);
  }
  .status { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
  .field { display: block; margin: 0 0 16px; }
  .field span {
    display: block;
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 14px;
    line-height: 18px;
  }
  .field input, .field select { width: 100%; min-width: 0; max-width: 100%; padding: 0 14px; }
</style>
</head>
<body>
  <p class="caption">List. Click a name.</p>
  <div class="window" id="list" data-screen>
    <div class="titlebar">Shortcuts</div>
    <div class="body">
      <p class="lede">Pick one, then write the file.</p>
      <div class="folder">
        <label for="path">Folder</label>
        <div class="path" id="path">No folder chosen</div>
        <button type="button" class="choose">Choose folder</button>
      </div>
      <div class="list">
        <a class="row" href="#parent"><span class="row-name">Parent folder</span><span class="kind">Shortcut</span></a>
        <a class="row" href="#parent"><span class="row-name">Open</span><span class="kind">Shortcut</span></a>
        <a class="row" href="#parent"><span class="row-name">Back</span><span class="kind">Shortcut</span></a>
        <a class="row" href="#parent"><span class="row-name">Forward</span><span class="kind">Shortcut</span></a>
        <a class="row" href="#files"><span class="row-name">Files</span><span class="kind">Script</span></a>
      </div>
      <button type="button" class="add">Add shortcut</button>
      <button type="button" class="write" disabled>Write</button>
      <p class="status">pick a folder.</p>
    </div>
  </div>

  <p class="caption">Parent folder, after the click.</p>
  <div class="window" id="parent" data-screen>
    <div class="titlebar"><a class="back" href="#list">Back</a>Parent folder</div>
    <div class="body">
      <label class="field"><span>Name</span><input aria-label="Name" value="Parent folder"></label>
      <label class="field"><span>Control</span><select aria-label="Control"><option>Up, hold B</option><option>Down, hold B</option><option>Left, hold B</option><option>Right, hold B</option><option>D-pad up</option><option>A</option><option>B</option><option>X</option><option>Y</option><option>Left bumper</option><option>Right bumper</option><option>Left grip</option><option>Right grip</option></select></label>
      <label class="field"><span>Action</span><select aria-label="Action"><option>Keyboard</option><option>Run script</option><option>Mouse button</option><option>Mouse wheel</option><option>Gamepad button</option><option>Show keyboard</option><option>Screenshot</option><option>Magnifier</option><option>Brighter</option><option>Dimmer</option><option>Quit</option><option>Change preset</option><option>Steam</option><option>Record</option><option>Marker</option><option>Clip</option><option>Screen reader</option></select></label>
      <label class="field"><span>Key</span><select aria-label="Key"><option>Up Arrow</option><option>Down Arrow</option><option>Left Arrow</option><option>Right Arrow</option><option>Enter</option><option>Escape</option><option>Space</option><option>Tab</option><option>Page Up</option><option>Page Down</option></select></label>
      <label class="field"><span>And</span><select aria-label="And"><option>Left Alt</option><option>none</option><option>Left Ctrl</option><option>Left Shift</option><option>Windows</option></select></label>
      <button type="button" class="remove">Remove</button>
    </div>
  </div>

  <p class="caption">Files, after the click.</p>
  <div class="window" id="files" data-screen>
    <div class="titlebar"><a class="back" href="#list">Back</a>Files</div>
    <div class="body">
      <label class="field"><span>Name</span><input aria-label="Name" value="Files"></label>
      <label class="field"><span>Control</span><select aria-label="Control"><option>Right grip, hold B</option><option>Left grip, hold B</option><option>A</option><option>B</option><option>X</option><option>Y</option></select></label>
      <label class="field"><span>Action</span><select aria-label="Action"><option>Run script</option><option>Keyboard</option><option>Mouse button</option><option>Mouse wheel</option><option>Gamepad button</option><option>Show keyboard</option><option>Screenshot</option><option>Magnifier</option><option>Brighter</option><option>Dimmer</option><option>Quit</option><option>Change preset</option><option>Steam</option><option>Record</option><option>Marker</option><option>Clip</option><option>Screen reader</option></select></label>
      <label class="field"><span>Command</span><input aria-label="Command" value="dolphin"></label>
      <label class="field"><span>Hotkey</span><select aria-label="Hotkey"><option>Left Ctrl + Page Up</option><option>Left Ctrl + Page Down</option><option>Left Shift + Page Up</option><option>Left Alt + Page Up</option></select></label>
      <button type="button" class="remove">Remove</button>
    </div>
  </div>
</body>
</html>
