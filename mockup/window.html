<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder buttons</title>
<style>
  :root {
    color-scheme: light;
    --bg: #d9d9d9;
    --title: #f3f3f3;
    --title-line: #d0d0d0;
    --title-text: #1a1a1a;
    --body: #ffffff;
    --text: #1a1a1a;
    --muted: #5c5c5c;
    --line: #c8c8c8;
    --field: #ffffff;
    --button: #f2f2f2;
    --button-text: #1a1a1a;
    --button-off: #f6f6f6;
    --button-off-text: #8a8a8a;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111111;
    --title: #2b2b2b;
    --title-line: #3a3a3a;
    --title-text: #f2f2f2;
    --body: #1e1e1e;
    --text: #f2f2f2;
    --muted: #b0b0b0;
    --line: #3a3a3a;
    --field: #2a2a2a;
    --button: #3a3a3a;
    --button-text: #f2f2f2;
    --button-off: #2a2a2a;
    --button-off-text: #8a8a8a;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111111;
      --title: #2b2b2b;
      --title-line: #3a3a3a;
      --title-text: #f2f2f2;
      --body: #1e1e1e;
      --text: #f2f2f2;
      --muted: #b0b0b0;
      --line: #3a3a3a;
      --field: #2a2a2a;
      --button: #3a3a3a;
      --button-text: #f2f2f2;
      --button-off: #2a2a2a;
      --button-off-text: #8a8a8a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.3 "Segoe UI", sans-serif;
    padding: 24px 16px;
  }
  .window {
    width: min(480px, 100%);
    margin: 0 auto;
    background: var(--body);
    border: 1px solid var(--line);
  }
  .titlebar {
    height: 32px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    background: var(--title);
    color: var(--title-text);
    border-bottom: 1px solid var(--title-line);
    font-size: 13px;
  }
  .body { padding: 16px; }
  .lede { margin: 0 0 16px; }
  .folder {
    display: grid;
    grid-template-columns: 4.5rem minmax(0, 1fr) auto;
    column-gap: 8px;
    row-gap: 8px;
    align-items: center;
  }
  .folder label { margin: 0; }
  .path, .choose, select, .write {
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: var(--field);
    color: var(--text);
    font: inherit;
  }
  .path {
    min-width: 0;
    padding: 0 8px;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .choose, .write {
    padding: 0 12px;
    background: var(--button);
    color: var(--button-text);
  }
  .write {
    grid-column: 2;
    justify-self: start;
    background: var(--button-off);
    color: var(--button-off-text);
  }
  h2 {
    margin: 16px 0 4px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
  }
  .hold { margin: 0 0 8px; }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    text-align: left;
    vertical-align: middle;
    padding: 4px 8px 4px 0;
    font-weight: 400;
  }
  th:last-child, td:last-child { padding-right: 0; }
  th { color: var(--muted); font-size: 12px; height: 20px; }
  col.direction { width: 5.5rem; }
  select { width: 100%; padding: 0 4px; }
</style>
</head>
<body>
  <p class="note">Opening state. No folder chosen. Write is off.</p>
  <div class="window" data-screen>
    <div class="titlebar">Folder buttons</div>
    <div class="body">
      <p class="lede">Backs up the current file, then writes this change.</p>
      <div class="folder">
        <label for="path">Folder</label>
        <div class="path" id="path">No folder chosen</div>
        <button type="button" class="choose">Choose folder</button>
        <button type="button" class="write" disabled>Write</button>
      </div>
      <h2>Change</h2>
      <p class="hold">Hold B, then the D-pad.</p>
      <table>
        <colgroup>
          <col class="direction">
          <col>
          <col>
        </colgroup>
        <thead>
          <tr>
            <th>Direction</th>
            <th>Key</th>
            <th>Sub</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Up</td>
            <td><select aria-label="Up key"><option>Up Arrow</option><option>Down Arrow</option><option>Left Arrow</option><option>Right Arrow</option><option>Enter</option></select></td>
            <td><select aria-label="Up sub"><option>Left Alt</option><option>none</option></select></td>
          </tr>
          <tr>
            <td>Down</td>
            <td><select aria-label="Down key"><option>Enter</option><option>Up Arrow</option><option>Down Arrow</option><option>Left Arrow</option><option>Right Arrow</option></select></td>
            <td><select aria-label="Down sub"><option>none</option><option>Left Alt</option></select></td>
          </tr>
          <tr>
            <td>Left</td>
            <td><select aria-label="Left key"><option>Left Arrow</option><option>Up Arrow</option><option>Down Arrow</option><option>Right Arrow</option><option>Enter</option></select></td>
            <td><select aria-label="Left sub"><option>Left Alt</option><option>none</option></select></td>
          </tr>
          <tr>
            <td>Right</td>
            <td><select aria-label="Right key"><option>Right Arrow</option><option>Up Arrow</option><option>Down Arrow</option><option>Left Arrow</option><option>Enter</option></select></td>
            <td><select aria-label="Right sub"><option>Left Alt</option><option>none</option></select></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
